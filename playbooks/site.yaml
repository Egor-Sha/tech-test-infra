- hosts: debian_vm
  become: true

  vars:
    backend_port: 8000
    backend_app_path: /opt/clocker/backend.py
    frontend_path: /var/www/html/index.html
    local_backend_path: ../files/backend.py
    local_frontend_path: ../files/index.html

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - python3-pip
          - nginx
        state: present

    - name: Install Flask via pip
      pip:
        name: flask
        executable: pip3

    - name: Ensure clocker user exists
      user:
        name: clocker
        system: yes
        shell: /usr/sbin/nologin

    - name: Ensure /opt/clocker directory exists
      file:
        path: /opt/clocker
        state: directory
        owner: clocker
        group: clocker
        mode: '0755'

    - name: Copy backend app to VM
      copy:
        src: "{{ local_backend_path }}"
        dest: "{{ backend_app_path }}"
        mode: '0755'

    - name: Copy frontend index.html to nginx directory
      copy:
        src: "{{ local_frontend_path }}"
        dest: "{{ frontend_path }}"
        mode: '0644'

    - name: Configure nginx to proxy /clock to backend (optional)
      blockinfile:
        path: /etc/nginx/sites-available/default
        block: |
          location /clock {
              proxy_pass http://127.0.0.1:{{ backend_port }};
          }

    - name: Restart nginx
      service:
        name: nginx
        state: restarted

    - name: Ensure /etc/clocker directory exists
      file:
        path: /etc/clocker
        state: directory
        owner: clocker
        group: clocker
        mode: '0755'

    - name: Copy backend environment variables file
      copy:
        src: ../files/backend.env
        dest: /etc/clocker/backend.env
        owner: clocker
        group: clocker
        mode: '0644'

    - name: Ensure .ssh directory exists for clocker
      file:
        path: /home/clocker/.ssh
        state: directory
        owner: clocker
        group: clocker
        mode: '0700'

    - name: Ensure public key is present in clocker's authorized_keys
      authorized_key:
        user: clocker
        state: present
        key: "{{ lookup('file', playbook_dir + '/../assets/rsa.pub') }}"

    - name: Create systemd service for backend with EnvironmentFile
      copy:
        dest: /etc/systemd/system/clocker-backend.service
        content: |
          [Unit]
          Description=Clocker backend service
          After=network.target

          [Service]
          EnvironmentFile=/etc/clocker/backend.env
          ExecStart=/usr/bin/python3 /opt/clocker/backend.py
          Restart=always
          User=clocker

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start backend service
      systemd:
        name: clocker-backend.service
        enabled: yes
        state: restarted
